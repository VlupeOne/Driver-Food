<aside class="sidebar">
  <nav>
    <ul>
      <li *ngFor="let item of menu">
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">
          <span class="material-icons">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
