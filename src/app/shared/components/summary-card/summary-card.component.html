<div class="card" [style.border-top-color]="accent">
  <div class="card-header">
    <div class="icon-wrapper" [style.background]="accent + '22'">
      <span class="material-icons">{{ icon }}</span>
    </div>
    <div>
      <p>{{ title }}</p>
      <strong>{{ value }}</strong>
    </div>
  </div>
</div>
