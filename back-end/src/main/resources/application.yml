spring:
  datasource:
    url: jdbc:h2:mem:financialdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-change-me-dev-jwt-secret-change-me-1234567890}
  expiration: 86400000

logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
    org.hibernate.SQL: DEBUG